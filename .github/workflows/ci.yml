name: CI

# 单元测试是**封闭的**：不碰真实系统、不需要 caddy 二进制。
# certutil（libnss3-tools）是例外但不是必需：NSS 库的用例要在**真的**
# NSS 库上跑，缺了 certutil 就整组跳过 —— 不装它测试仍然全绿，
# 只是那组用例在 CI 上不执行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # 风格与类型：**阻断**。规则集见 pyproject 的 [tool.ruff] / [tool.mypy]。
    # 依赖按 uv.lock 装（--locked：锁文件与 pyproject 不一致就直接失败）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 装依赖（按锁文件）
        run: uv sync --locked --all-groups
      - name: ruff check
        run: uv run ruff check src/ tests/
      - name: ruff format --check
        run: uv run ruff format --check src/ tests/
      - name: mypy
        run: uv run mypy

  test:
    # Linux 与 macOS 都要跑：平台层（systemd / launchd、证书信任、
    # DNS 路由）两端的实现不同，只跑 Linux 会漏掉一整边。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 装 NSS 工具（certutil）
        # NSS 库判定的用例（tests/test_nss_real_certutil.py）要在真库上跑：
        # NSS 按 (issuer, serial) 去重这条规则只有真 certutil 才有。
        # macOS 上没有 libnss3-tools，那组用例会自己跳过。
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: 装依赖（按锁文件）
        run: uv sync --locked --all-groups
      - name: 单元测试
        # tests/test_integration.py 需要真实的 caddy 二进制与真实网络，
        # 属于「真机验证」，不进 CI。
        run: uv run pytest -q --ignore=tests/test_integration.py
