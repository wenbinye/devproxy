name: CI

# 单元测试是**封闭的**：不碰真实系统、不需要 caddy 二进制、不需要网络。
# 因此 CI 只需要装 typer / rich / pytest 就能跑完。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "typer>=0.12" "rich>=13" "pytest>=8"

      - name: 单元测试
        # tests/test_integration.py 需要真实的 caddy 二进制与真实网络，
        # 属于「真机验证」，不进 CI。
        run: python -m pytest -q --ignore=tests/test_integration.py
