name: CI

# 单元测试是**封闭的**：不碰真实系统、不需要 caddy 二进制。
# certutil（libnss3-tools）是例外但不是必需：NSS 库的用例要在**真的**
# NSS 库上跑，缺了 certutil 就整组跳过 —— 不装它测试仍然全绿，
# 只是那组用例在 CI 上不执行。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 NSS 工具（certutil）
        # NSS 库判定的用例（tests/test_nss_real_certutil.py）要在真库上跑：
        # NSS 按 (issuer, serial) 去重这条规则只有真 certutil 才有。
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "typer>=0.12" "rich>=13" "pytest>=8"

      - name: 单元测试
        # tests/test_integration.py 需要真实的 caddy 二进制与真实网络，
        # 属于「真机验证」，不进 CI。
        run: python -m pytest -q --ignore=tests/test_integration.py
