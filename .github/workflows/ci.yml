name: CI

# The unit suite is **hermetic**: it never touches the real system and needs no caddy
# binary. certutil (libnss3-tools) is the exception, and not even a required one: the
# NSS tests must run against a **real** NSS DB, and the whole group is skipped without
# certutil -- the suite still passes, that group just does not run on CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Style and types: **blocking**. The rule set lives in pyproject's
    # [tool.ruff] / [tool.mypy]. Dependencies come from uv.lock (--locked: fail outright
    # when the lock file disagrees with pyproject).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies (from the lock file)
        run: uv sync --locked --all-groups
      - name: ruff check
        run: uv run ruff check src/ tests/
      - name: ruff format --check
        run: uv run ruff format --check src/ tests/
      - name: mypy
        run: uv run mypy

  test:
    # Both Linux and macOS run: the platform layer (systemd / launchd, certificate trust,
    # the DNS route) is implemented differently on each side, and Linux alone would miss
    # half of it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the NSS tools (certutil)
        # The NSS-trust tests (tests/test_nss_real_certutil.py) need a real DB: the rule
        # that NSS dedupes by (issuer, serial) only exists in the real certutil.
        # macOS has no libnss3-tools, so that group skips itself there.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Install dependencies (from the lock file)
        run: uv sync --locked --all-groups
      - name: Unit tests
        # tests/test_integration.py needs a real caddy binary and real network access, so
        # it counts as real-machine verification and stays out of CI.
        run: uv run pytest -q --ignore=tests/test_integration.py
