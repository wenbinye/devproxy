name: Publish

# Release: build and upload to PyPI when a tag is pushed or a GitHub Release is published.
# Uses PyPI's **trusted publishing** (OIDC): no API token lives in this repository;
# PyPI authorizes by "repository + workflow file + environment name".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/devproxy
    permissions:
      id-token: write # the only permission trusted publishing needs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (from the lock file)
        run: uv sync --locked --all-groups
      - name: Run the tests before publishing
        run: uv run pytest -q --ignore=tests/test_integration.py
      - name: Build the sdist and wheel
        run: uv build
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
