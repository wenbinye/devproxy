name: Feature request
description: Something you want devproxy to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you want solved
      description: "Start with the problem rather than the solution — there is often a simpler fix"
      render: text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you imagine it working
      description: "Be concrete about what the command would look like"
      render: text
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Only affects the local development experience
        - Affects the whole machine (DNS / certificates / service units)
        - Not sure
    validations:
      required: true
