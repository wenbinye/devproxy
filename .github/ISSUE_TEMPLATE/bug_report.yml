name: Bug report
description: devproxy errors out, behaves oddly, or will not install on a machine
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Take a look at the
        [troubleshooting guide](https://github.com/wenbinye/devproxy/blob/main/docs/troubleshooting.md) first** —
        most problems have an answer there.

        This tool changes your system (installs a CA, edits DNS, writes service units),
        so the fields below are what makes a diagnosis possible — especially the **full
        command** and the **exit code**.
  - type: input
    id: version
    attributes:
      label: Version
      description: "The output of `devproxy --version`, or how you installed it"
      placeholder: "0.1.0 (uv tool install devproxy)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The full command you ran
      description: "Paste it verbatim (including everything after `--`)"
      placeholder: "devproxy up web -- sh -c 'npm run dev -- --port $PORT'"
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: "The result of `echo $?` in your terminal"
      placeholder: "1"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: "The error and its context (please **remove** tokens, secrets, and internal addresses)"
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `devproxy doctor`
      description: "The health check describes the environment in one go"
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Every step from a clean state to the failure"
      render: text
  - type: input
    id: related
    attributes:
      label: Related issues / PRs
      description: "If any"
