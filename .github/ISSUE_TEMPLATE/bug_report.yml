name: 报告一个 Bug
description: devproxy 报错了、行为不对、或者在某台机器上装不起来
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈！**先看一眼 [排障文档](docs/troubleshooting.md)**，多数问题在那里有答案。

        这个工具会改你的系统（装 CA、改 DNS、写服务单元），所以下面几项
        对定位问题很关键 —— 尤其**完整命令**与**退出码**。
  - type: input
    id: version
    attributes:
      label: 版本
      description: "`devproxy --version` 的输出，或你安装它的方式"
      placeholder: "0.1.0 (uv tool install devproxy)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Linux
        - macOS
        - Windows（WSL）
        - 其他
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 执行的完整命令
      description: "逐字贴出来（包括 `--` 后面的部分）"
      placeholder: "devproxy up web -- sh -c 'npm run dev -- --port $PORT'"
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: 退出码
      description: "终端里 `echo $?` 的结果"
      placeholder: "1"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 完整输出
      description: "报错与上下文（请**删掉**里面的 token / 密钥 / 内网地址）"
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`devproxy doctor` 的输出"
      description: "体检结果能一次说清环境状态"
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: "从干净状态到出问题的每一步"
      render: text
  - type: input
    id: related
    attributes:
      label: 相关 issue / PR
      description: 如果有
