[project]
name = "devproxy"
version = "0.1.0"
description = "本地开发环境一键部署与域名网关"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
devproxy = "devproxy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devproxy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
